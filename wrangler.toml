name = "encurtador"
main = "src/index.ts"
compatibility_date = "2025-09-25"
# Domínio próprio: o Wrangler cria o DNS e o certificado na zona cuturl.dev (mesma conta)
routes = [{ pattern = "cuturl.dev", custom_domain = true }]
# Mantém o *.workers.dev no ar: links curtos antigos foram distribuídos nesse endereço
workers_dev = true

[assets]
directory = "./web/out"
binding = "ASSETS"
run_worker_first = ["/*", "!/_next/*", "!/favicon.svg"]
html_handling = "none"
not_found_handling = "none"

[[ratelimits]]
name = "PUBLIC_RATE_LIMIT"
namespace_id = "1007102026"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "URLS"
id = "a37a1ce3b3d94545a21e18f80ba105f2"

[[durable_objects.bindings]]
name = "CLICK_COUNTER"
class_name = "ClickCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClickCounter"]

[vars]
# Domínio público usado na resposta de short_url, mesmo quando o link é criado pelo *.workers.dev
# Se vazio, usa a URL do próprio Worker (request.url)
PUBLIC_BASE_URL = "https://cuturl.dev"
AUDIT_RETENTION_MONTHS = "12"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
